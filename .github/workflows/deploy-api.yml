# Deploys the weather API (apps/api) to Cloudflare Workers on every push to the
# backend branch that touches it: applies any new database migrations, deploys
# the Worker, then checks it responds.
#
# Needs the repo secret CLOUDFLARE_API_TOKEN and the repo variable
# CLOUDFLARE_ACCOUNT_ID. See apps/api/README.md.
name: Deploy API

on:
  push:
    branches: [backend]
    paths:
      - apps/api/**
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply fieldwise --remote

      - name: Deploy
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Check the API responds
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/health/live"
          echo
          echo "API is live at ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
